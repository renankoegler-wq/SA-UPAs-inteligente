<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">
    <header class="cabecalho">
        <div class="limite linha">
            <a class="marca" href="#inicio">
                <span class="marca-sus">SUS</span>
                <span>UPAs Inteligente</span>
            </a>

            <div class="acoes">
                <button class="botao-icone" type="button" aria-label="Notificações" disabled>
                    <span aria-hidden="true">🔔︎</span>
                </button>
                <button class="botao-icone" type="button" aria-label="Perfil" disabled>
                    <span aria-hidden="true">👤︎</span>
                </button>
            </div>
        </div>
    </header>

    <section class="bannerSantaCatarina">
        <div>
            <p>Consulte o caminho mais facil para sua saude com um só click</p>
        </div>

        <img src="assets/santa-catarina.svg" alt="santa catarina">
    </section>

    <a href="https://sso.acesso.gov.br/login?client_id=www.gov.br&authorization_id=1a21faadf86" class="botãoLoginGov">Entrar com gov.br</a>


</body>
</html>
