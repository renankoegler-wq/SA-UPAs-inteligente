<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPAs Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body id="inicio">
    <header class="cabecalho">
        <div class="limite linha">
            <a class="marca" href="#inicio">
                <span class="marca-sus">SUS</span>
                <span>UPAs Inteligente</span>
            </a>

            <div class="acoes">
                <button class="botao-icone" type="button" aria-label="Notificações" disabled>
                    <span aria-hidden="true">🔔︎</span>
                </button>
                <button class="botao-icone" type="button" aria-label="Perfil" disabled>
                    <span aria-hidden="true">👤︎</span>
                </button>
            </div>
        </div>
    </header>

    <main class="limite">
        <section class="saudacao" aria-labelledby="titulo">
            <div>
                <h1 id="titulo">Olá, usuário!</h1>
                <p>Encontre unidades de pronto atendimento e acesse os serviços do portal.</p>
            </div>
            <img src="assets/pessoas.svg" alt="">
        </section>

        <section class="servicos" aria-labelledby="titulo-servicos">
            <h2 id="titulo-servicos">Serviços</h2>
            
            <ul class="lista">
                <li>
                    <a class="servico" href="sa-upas-nicolas/listagem-upas/listagem.html">
                        <span class="icone" aria-hidden="true">✚</span> UPAs
                    </a>
                </li>
                <li>
                    <button class="servico" type="button" disabled>
                        <span class="icone" aria-hidden="true">✉</span> Caixa postal
                    </button>
                </li>
                <li>
                    <button class="servico" type="button" disabled>
                        <span class="icone" aria-hidden="true">⚙︎</span> Preferências
                    </button>
                </li>
                <li>
                    <a class="servico" href="https://www.gov.br/pt-br">
                        <span class="icone" aria-hidden="true">▦</span> GovBR
                    </a>
                </li>
                <li>
                    <button class="servico" type="button" disabled>
                        <span class="icone" aria-hidden="true">☷</span> Classificações
                    </button>
                </li>
            </ul>
        </section>
    </main>

    <nav class="navegacao" aria-label="Navegação principal">
        <div class="limite atalhos">
            <a href="#inicio" aria-current="page">
                <span class="simbolo" aria-hidden="true">⌂</span> Início
            </a>
            <button type="button" disabled>
                <span class="simbolo" aria-hidden="true">⚠︎</span> Alertas
            </button>
            <button class="localizacao" type="button" disabled>
                <span class="simbolo" aria-hidden="true">📍︎</span> Localizar
            </button>
            <a href="sa-upas-nicolas/listagem-upas/listagem.html">
                <span class="simbolo" aria-hidden="true">✚</span> UPAs
            </a>
            <button id="abrir-menu" type="button" aria-haspopup="dialog" aria-controls="menu">
                <span class="simbolo" aria-hidden="true">☰</span> Menu
            </button>
        </div>
    </nav>

    <dialog id="menu" class="menu" aria-labelledby="titulo-menu">
        <div class="linha">
            <h2 id="titulo-menu">SUS</h2>
            <form method="dialog">
                <button class="botao-icone" aria-label="Fechar menu" autofocus>×</button>
            </form>
        </div>
        <p>Versão 6.7.6.7 beta</p>
        <ul class="lista">
            <li><button class="servico" type="button" disabled>Termos de uso e aviso de privacidade</button></li>
            <li><button class="servico" type="button" disabled>Sair do aplicativo</button></li>
            <li><button class="servico" type="button" disabled>Deslogar e sair</button></li>
        </ul>
    </dialog>
</body>
</html>
